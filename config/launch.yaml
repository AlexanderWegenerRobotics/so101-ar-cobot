profiles:
  dev:
    sim: {viewer: false}
    nodes:
      - node: perception.node:ObjectPublisher
      - node: supervisor.node:SafetySupervisor
      - node: controls.node:ArmController
      - node: hardware.workspace:WorkspacePublisher
      - node: sim.hand:SimHand
        params: {source: agent, side: right, agent: {deviate: 0.2}}   # sim human doing its part of the plan; "off": no hand, scripted: reaches over the cubes (supervisor tests)
      - node: task.node:TaskManager
        params: {autostart: true, alpha: 0.5}

  dev_viewer:
    sim: {viewer: true}
    nodes:
      - node: perception.node:ObjectPublisher
      - node: supervisor.node:SafetySupervisor
      - node: controls.node:ArmController
      - node: hardware.workspace:WorkspacePublisher
      - node: sim.hand:SimHand
        params: {source: agent, side: right, agent: {deviate: 0.2}}   # sim human doing its part of the plan; "off": no hand, scripted: reaches over the cubes (supervisor tests)
      - node: task.node:TaskManager
        params: {autostart: true, alpha: 0.5}

  quest:
    sim: {viewer: true}
    nodes:
      - node: perception.node:ObjectPublisher
      - node: supervisor.node:SafetySupervisor
      - node: controls.node:ArmController
      - node: hardware.workspace:WorkspacePublisher
      - node: sim.hand:SimHand
        params: {source: bus}
      - node: task.node:TaskManager
        params: {autostart: false, alpha: 0.5}   # waits for Go on the wrist menu
      - node: interfaces.quest_bridge:QuestBridge

  vr:
    sim: {viewer: true}
    nodes:
      - node: perception.node:ObjectPublisher
      - node: supervisor.node:SafetySupervisor
      - node: controls.node:ArmController
      - node: hardware.workspace:WorkspacePublisher
      - node: sim.hand:SimHand
        params: {source: bus}
      - node: task.node:TaskManager
        params: {autostart: false, alpha: 0.5}   # waits for Go on the wrist menu
      - node: sim.scene_stream:SceneStreamer
        params: {rate_hz: 60}
      - node: sim.control:SimControl
      - node: interfaces.quest_bridge:QuestBridge
