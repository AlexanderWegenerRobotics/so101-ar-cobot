name: so101
backend: sim
id: so101_follower
port: /dev/tty.usbmodem58760431541
calibration_dir: config/calibration
use_degrees: true
max_relative_target: null
disable_torque_on_disconnect: true

max_payload: 0.20
max_grasp_width: 0.06
reach: [0.10, 0.32]
home_qpos: [0.0, -1.49, 0.0, 0.0, 0.0, 0.0]

sim:
  world:
    realtime: true
    viewer: false
  joint_map:
    shoulder_pan: {sign: 1, offset_deg: 0.0}
    shoulder_lift: {sign: 1, offset_deg: 0.0}
    elbow_flex: {sign: 1, offset_deg: 0.0}
    wrist_flex: {sign: 1, offset_deg: 0.0}
    wrist_roll: {sign: 1, offset_deg: 0.0, full_turn: true}
    gripper: {sign: 1, mode: range}

controller:
  rate_hz: 30
  max_joint_speed: 60.0    # deg/s, cap per joint, scaled by the safety speed_scale
  max_angular_speed: 1.0   # rad/s, tool pitch and roll
  watchdog_timeout: 0.2    # s, safety messages and stream commands
  goal_tolerance: 1.0      # deg, how close counts as reached
  goal_timeout: 20.0       # s of active motion before a goal fails

grasp:
  speed: 0.10                # m/s, tool speed for every step
  hover_height: 0.05         # m, tool height while moving over cubes
  release_height: 0.08       # m, tool height over the bins and when passing the base
  via_x: 0.22                # m, waypoint in front of the base between cubes and bins
  transit_pitch_deg: -80.0   # tool tilt while moving, -90 points straight down
  gripper_open: 80.0         # 0 closed to 100 open
  gripper_closed: 0.0
  dwell: 0.6                 # s to wait after a gripper command
  ready_deg: [-0.3, -22.0, 25.2, 86.8, 0.0]   # pan lift elbow flex roll, start pose
